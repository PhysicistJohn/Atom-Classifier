name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # verify checks out the Atom-Atomizer and Atom-SignalLab siblings at the
  # exact pinned commits below. All Atom-* repos are public, so the default
  # GITHUB_TOKEN covers the sibling checkouts and no PAT or gate job is
  # needed.
  #
  # SignalLab is checked out TWICE, at two different commits, on purpose:
  #   Atom-SignalLab     historic, the corpus the checked-in model was fit on
  #   Atom-SignalLab-IQ  current, the exact-I/Q v2 contract new code builds on
  # They are separate paths because they are separate facts. Collapsing them
  # onto one commit would either silently restate the sealed model's training
  # data or hold the new I/Q code to a contract that no longer exists.
  #
  # Scope: typecheck + the vitest suite (embedding classifier, magnitude
  # flavor, blind recovery parity, Bayesian source closure). The multi-hour
  # Bayesian model regeneration/validation stages and the sampling-worker
  # reproducibility check were removed from CI when the application dropped
  # the Bayesian classifier for the embedding classifier (the worker check
  # pins a bundle digest recorded in the checked-in Bayesian model, which
  # only reproduces against the authoring host's sibling state); run
  # `npm run check:signal-classifier-model` deliberately when that model
  # matters.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Atom-Classifier
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: Atom-Classifier
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-DSP
          ref: v0.1.0
          path: Atom-DSP
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-Atomizer
          # Training/validation imports this exact committed analysis/contracts
          # closure; do not silently follow a moving default branch.
          ref: df6c2ee06003eae94b1e02b52fb50ed0082b3ea7
          path: Atom-Atomizer
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-SignalLab
          # Pinned to the exact commit the checked-in model's training corpus
          # came from -- this repo's reproduction/validation must match that
          # data exactly, independent of SignalLab's live/current state.
          ref: e7d48afbce7165fa04fd551629891123f3b86d34
          path: Atom-SignalLab
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-SignalLab
          # The exact-I/Q v2 source of truth. Everything under
          # tools/classifier-receiver-iq.ts and
          # tools/generate-signallab-iq-corpus.ts imports this checkout, and the
          # corpus generator refuses to run unless HEAD here is exactly this
          # commit and the worktree is clean.
          ref: 98114b100a15ad84875908be5210aae1b2dc7274
          path: Atom-SignalLab-IQ
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            Atom-DSP/package-lock.json
            Atom-Classifier/package-lock.json
            Atom-Atomizer/package-lock.json
            Atom-SignalLab/package-lock.json
            Atom-SignalLab-IQ/package-lock.json
      - name: Install exact npm
        run: npm install --global npm@10.9.8
      - name: Verify exact Node and npm versions
        shell: bash
        run: |
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"
      - name: Build Atom-DSP
        working-directory: Atom-DSP
        run: npm ci && npm run build
      - name: Install Atomizer dependencies
        working-directory: Atom-Atomizer
        # Dev dependencies included: the bare '@tinysa/contracts' imports inside
        # the pinned analysis sources resolve through that workspace package's
        # built dist, and building it needs the repo's toolchain.
        run: npm ci --ignore-scripts
      - name: Build the pinned Atomizer contracts package
        working-directory: Atom-Atomizer
        run: npm run build -w @tinysa/contracts
      - name: Install pinned SignalLab runtime dependencies
        working-directory: Atom-SignalLab
        run: npm ci --omit=dev --ignore-scripts
      - name: Install pinned SignalLab I/Q runtime dependencies
        working-directory: Atom-SignalLab-IQ
        # node_modules is ignored by that repo, so this leaves the worktree
        # clean and the corpus generator's clean-source assertion still holds.
        run: npm ci --omit=dev --ignore-scripts
      - name: Install Atom-Classifier
        run: npm ci
      # Called out separately from the aggregate typecheck below so a break in
      # the exact-I/Q v2 integration is attributed to it directly.
      - run: npm run typecheck:signal-lab-iq
      - run: npm run typecheck
      - run: npm test
      # Disposable smoke: prove the corpus generator still runs end to end
      # against the pinned I/Q checkout and still emits a manifest the training
      # loader accepts. Deliberately tiny, deliberately thrown away, and
      # deliberately not written anywhere near training/artifacts -- CI must
      # never be able to restate the sealed corpus.
      - name: Smoke the SignalLab I/Q corpus generator
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          SIGNAL_LAB_SOURCE_COMMIT="98114b100a15ad84875908be5210aae1b2dc7274" \
          OUTPUT_DIR="$tmp_dir" \
          SAMPLE_COUNT=256 \
          TARGET_PER_CLASS=1 \
          MIN_PER_PROFILE=1 \
          SIGNAL_LAB_IQ_PROFILES="gsm-normal-burst,bluetooth-le-advertising,nr-n78-tdd-100m,custom-lte" \
            npx tsx tools/generate-signallab-iq-corpus.ts
          test -s "$tmp_dir/corpus.json"
          test -s "$tmp_dir/corpus.f32"
          test -s "$tmp_dir/corpus_clean.f32"
      - run: npm run audit
