<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Complex U-Net multi-task classifier architecture</title>
  <desc>Complex-valued U-Net for RF signal classification. An impaired I/Q capture is encoded through four downsampling complex-conv levels to a bottleneck, which feeds class, sub-profile and physical-parameter heads. A mirrored decoder with skip connections reconstructs the clean emission, supervised by coherence against the stored clean pair.</desc>
  <rect width="1180" height="760" fill="#ffffff"/>

  <text x="32" y="42" font-size="21" font-weight="500" fill="#0b0b0b">Complex U-Net multi-task classifier</text>
  <text x="32" y="64" font-size="13" fill="#52514e">807,467 parameters · input 2 x 16384 real (I/Q) · phase-equivariant throughout</text>

  <!-- INPUT -->
  <rect x="32" y="100" width="150" height="86" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="107" y="126" font-size="13" font-weight="500" text-anchor="middle" fill="#2C2C2A">impaired capture</text>
  <text x="107" y="146" font-size="11" text-anchor="middle" fill="#5F5E5A">2 x 16384 real</text>
  <text x="107" y="163" font-size="11" text-anchor="middle" fill="#5F5E5A">-&gt; complex (B,1,L)</text>
  <text x="107" y="179" font-size="11" text-anchor="middle" fill="#5F5E5A">SNR -5..45 dB</text>

  <!-- ENCODER -->
  <text x="255" y="92" font-size="12" font-weight="500" fill="#52514e">encoder — complex conv, decimate x2 per level</text>
  <g>
    <rect x="222" y="100" width="118" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="281" y="124" font-size="12" font-weight="500" text-anchor="middle" fill="#3C3489">enc 1 · 8 ch</text>
    <text x="281" y="142" font-size="11" text-anchor="middle" fill="#534AB7">L = 16384</text>
    <text x="281" y="157" font-size="10" text-anchor="middle" fill="#534AB7">fine: multipath</text>

    <rect x="360" y="100" width="118" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="419" y="124" font-size="12" font-weight="500" text-anchor="middle" fill="#3C3489">enc 2 · 16 ch</text>
    <text x="419" y="142" font-size="11" text-anchor="middle" fill="#534AB7">L / 2</text>

    <rect x="498" y="100" width="118" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="557" y="124" font-size="12" font-weight="500" text-anchor="middle" fill="#3C3489">enc 3 · 32 ch</text>
    <text x="557" y="142" font-size="11" text-anchor="middle" fill="#534AB7">L / 4</text>

    <rect x="636" y="100" width="118" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="695" y="124" font-size="12" font-weight="500" text-anchor="middle" fill="#3C3489">enc 4 · 64 ch</text>
    <text x="695" y="142" font-size="11" text-anchor="middle" fill="#534AB7">L / 8</text>
    <text x="695" y="157" font-size="10" text-anchor="middle" fill="#534AB7">coarse: CFO, clock</text>
  </g>

  <!-- BOTTLENECK -->
  <rect x="790" y="94" width="150" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="865" y="120" font-size="13" font-weight="500" text-anchor="middle" fill="#085041">bottleneck</text>
  <text x="865" y="139" font-size="11" text-anchor="middle" fill="#0F6E56">128 ch · L / 16</text>
  <text x="865" y="156" font-size="10" text-anchor="middle" fill="#0F6E56">mean + std pool</text>

  <!-- arrows encoder -->
  <path d="M182,143 L218,143" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M340,133 L356,133" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M478,133 L494,133" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M616,133 L632,133" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M754,133 L786,133" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888780"/>
    </marker>
    <marker id="skip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#BA7517"/>
    </marker>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/>
    </marker>
  </defs>

  <!-- HEADS from bottleneck -->
  <path d="M865,172 L865,214" stroke="#0F6E56" stroke-width="2" marker-end="url(#head)"/>
  <text x="878" y="196" font-size="10" fill="#0F6E56">bottleneck only</text>

  <rect x="756" y="220" width="120" height="62" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="816" y="243" font-size="12" font-weight="500" text-anchor="middle" fill="#085041">class embed</text>
  <text x="816" y="261" font-size="11" text-anchor="middle" fill="#0F6E56">32-d, L2-norm</text>
  <text x="816" y="275" font-size="10" text-anchor="middle" fill="#0F6E56">7-way prototypical</text>

  <rect x="886" y="220" width="120" height="62" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="946" y="243" font-size="12" font-weight="500" text-anchor="middle" fill="#085041">sub-profile</text>
  <text x="946" y="261" font-size="11" text-anchor="middle" fill="#0F6E56">37-way</text>
  <text x="946" y="275" font-size="10" text-anchor="middle" fill="#0F6E56">finer than the label</text>

  <rect x="1016" y="220" width="132" height="62" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="1082" y="243" font-size="12" font-weight="500" text-anchor="middle" fill="#085041">physical params</text>
  <text x="1082" y="261" font-size="11" text-anchor="middle" fill="#0F6E56">6 regressions</text>
  <text x="1082" y="275" font-size="10" text-anchor="middle" fill="#0F6E56">SNR, CFO, clock…</text>

  <path d="M840,172 L820,216" stroke="#0F6E56" stroke-width="1.2" fill="none"/>
  <path d="M890,172 L940,216" stroke="#0F6E56" stroke-width="1.2" fill="none"/>
  <path d="M910,172 L1070,216" stroke="#0F6E56" stroke-width="1.2" fill="none"/>

  <!-- DECODER -->
  <text x="255" y="378" font-size="12" font-weight="500" fill="#52514e">decoder — upsample x2, concatenate skip, complex conv</text>
  <g>
    <rect x="636" y="386" width="118" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="695" y="410" font-size="12" font-weight="500" text-anchor="middle" fill="#712B13">dec 4 · 64 ch</text>
    <text x="695" y="428" font-size="11" text-anchor="middle" fill="#993C1D">L / 8</text>

    <rect x="498" y="386" width="118" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="557" y="410" font-size="12" font-weight="500" text-anchor="middle" fill="#712B13">dec 3 · 32 ch</text>
    <text x="557" y="428" font-size="11" text-anchor="middle" fill="#993C1D">L / 4</text>

    <rect x="360" y="386" width="118" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="419" y="410" font-size="12" font-weight="500" text-anchor="middle" fill="#712B13">dec 2 · 16 ch</text>
    <text x="419" y="428" font-size="11" text-anchor="middle" fill="#993C1D">L / 2</text>

    <rect x="222" y="386" width="118" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="281" y="410" font-size="12" font-weight="500" text-anchor="middle" fill="#712B13">dec 1 · 8 ch</text>
    <text x="281" y="428" font-size="11" text-anchor="middle" fill="#993C1D">L = 16384</text>
  </g>

  <path d="M865,172 L865,340 L760,340 L760,386" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M636,419 L620,419" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M498,419 L482,419" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M360,419 L344,419" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- SKIPS -->
  <path d="M281,166 L281,382" stroke="#BA7517" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#skip)"/>
  <path d="M419,166 L419,382" stroke="#BA7517" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#skip)"/>
  <path d="M557,166 L557,382" stroke="#BA7517" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#skip)"/>
  <path d="M695,166 L695,382" stroke="#BA7517" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#skip)"/>
  <rect x="120" y="258" width="86" height="24" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="163" y="275" font-size="11" font-weight="500" text-anchor="middle" fill="#633806">skip</text>
  <text x="120" y="300" font-size="10" fill="#854F0B">carries payload AROUND</text>
  <text x="120" y="315" font-size="10" fill="#854F0B">the bottleneck, so the</text>
  <text x="120" y="330" font-size="10" fill="#854F0B">bottleneck need not</text>
  <text x="120" y="345" font-size="10" fill="#854F0B">store random data bits</text>

  <!-- OUTPUT / LOSSES -->
  <rect x="32" y="386" width="150" height="66" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="107" y="410" font-size="12" font-weight="500" text-anchor="middle" fill="#2C2C2A">reconstruction</text>
  <text x="107" y="428" font-size="11" text-anchor="middle" fill="#5F5E5A">complex, 16384</text>
  <path d="M222,419 L186,419" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="32" y="486" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="107" y="509" font-size="12" font-weight="500" text-anchor="middle" fill="#0C447C">clean pair</text>
  <text x="107" y="527" font-size="10" text-anchor="middle" fill="#185FA5">corpus_clean.f32</text>
  <text x="107" y="542" font-size="10" text-anchor="middle" fill="#185FA5">same emission, no channel</text>
  <path d="M107,486 L107,456" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- LOSS BOX -->
  <rect x="222" y="500" width="926" height="118" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
  <text x="242" y="524" font-size="13" font-weight="500" fill="#0b0b0b">training objective</text>
  <text x="242" y="548" font-size="12" fill="#52514e">L = L_proto(class) + w_rec · (1 − coherence(recon, clean)) + w_prof · CE(profile) + w_par · SmoothL1(params)</text>
  <text x="242" y="572" font-size="11" fill="#898781">coherence is scale- and phase-invariant, so the decoder is scored on recovering STRUCTURE, not absolute gain or phase</text>
  <text x="242" y="592" font-size="11" fill="#898781">measured gap to close: 0.153 on impaired rows · physical ceiling 0.878 (bounded by SNR/(1+SNR))</text>
  <text x="242" y="610" font-size="11" fill="#898781">w_rec = w_prof = w_par = 0 reduces this to a plain classifier of identical size — the capacity control</text>

  <!-- NOTES -->
  <text x="32" y="656" font-size="12" font-weight="500" fill="#0b0b0b">design notes</text>
  <text x="32" y="678" font-size="11" fill="#52514e">1. Every conv is complex (weight = Wr + i·Wi) and every activation is modReLU, so a global phase rotation of the capture rotates the</text>
  <text x="32" y="694" font-size="11" fill="#52514e">    reconstruction identically and leaves the embedding unchanged — verified end to end, not assumed.</text>
  <text x="32" y="714" font-size="11" fill="#52514e">2. Heads read the bottleneck ONLY. Nothing downstream of a skip reaches them, so a lazy bottleneck costs classification accuracy directly.</text>
  <text x="32" y="734" font-size="11" fill="#52514e">3. Input is the impaired capture, target is the clean one — copying the input through the skips is therefore NOT an optimal solution.</text>
</svg>
